server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location ^~ /resource/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|json|xml|png|jpg|jpeg|gif|webp|svg|ico|avif|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
